name: Release

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [auto, beta, release]
        default: auto
      dry_run:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    # Beta tags are pushed by the bot and match the tag glob above; skip the
    # release path for any prerelease tag (contains '-') to avoid a retrigger loop.
    if: ${{ !(github.ref_type == 'tag' && contains(github.ref_name, '-')) }}
    uses: dobbo-ca/.github/.github/workflows/release-go.yml@v1
    with:
      mode: ${{ inputs.mode || 'auto' }}
      dry-run: ${{ inputs.dry_run || false }}
      go-version: '1.23'
      binary-name: az
      cmd-path: ./cmd/az/main.go
      version-pkg: main
      build-matrix: '[{"goos":"linux","goarch":"amd64"},{"goos":"linux","goarch":"arm64"},{"goos":"darwin","goarch":"amd64"},{"goos":"darwin","goarch":"arm64"},{"goos":"windows","goarch":"amd64"},{"goos":"windows","goarch":"arm64"}]'
      asset-name-template: 'az-go-{version}-{goos}-{goarch}'
    secrets:
      app-id: ${{ vars.GH_PUB_APP_CLIENT_ID }}
      app-pem: ${{ secrets.GH_PUB_APP_PEM }}

  msi:
    needs: release
    # MSI ProductVersion cannot express prerelease semantics (see
    # packaging/windows/build-msi.sh), so only build for final releases, same
    # gate as update-homebrew below.
    if: ${{ needs.release.outputs.is_release == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download windows/amd64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-windows-amd64
          path: dist

      - name: Extract az.exe
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: unzip -o "dist/az-go-${VERSION}-windows-amd64.zip" -d stage

      - name: Build MSI
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # ubuntu-latest (24.04) ships msitools 0.103, which predates the
          # <Environment> element needed for the PATH entry. Build inside a
          # 26.04 container to get wixl >= 0.106 instead.
          docker run --rm -v "$PWD:/w" -w /w -e VERSION ubuntu:26.04 bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wixl msitools
            wixl --version
            packaging/windows/build-msi.sh \
              --version "$VERSION" \
              --exe stage/az.exe \
              --arch amd64 \
              --out dist-msi
          '

      - name: Upload MSI to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # `gh release upload` targets the release for an existing tag: it
          # fails if the tag has no release yet (so it can never create a
          # second release for this run). --clobber is safe here since the
          # reusable release job only ever uploads *.tar.gz/*.zip/*.sha256,
          # so a *.msi/*.msi.sha256 name can only collide with a previous
          # run of this same job (e.g. a re-run after update-homebrew
          # failed), which is exactly the case we want to overwrite.
          gh release upload "${VERSION}" \
            dist-msi/*.msi dist-msi/*.msi.sha256 \
            --repo "${{ github.repository }}" \
            --clobber

  update-homebrew:
    needs: release
    if: ${{ needs.release.outputs.is_release == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_PUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_PUB_APP_PEM }}
          owner: dobbo-ca
          repositories: homebrew-taps

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract SHA256 Checksums
        id: checksums
        run: |
          mkdir -p checksums
          find artifacts -name "*.sha256" -exec cp {} checksums/ \;

          # Extract checksums for each platform
          echo "darwin_amd64=$(cat checksums/az-go-*-darwin-amd64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "darwin_arm64=$(cat checksums/az-go-*-darwin-arm64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "linux_amd64=$(cat checksums/az-go-*-linux-amd64.tar.gz.sha256)" >> $GITHUB_OUTPUT
          echo "linux_arm64=$(cat checksums/az-go-*-linux-arm64.tar.gz.sha256)" >> $GITHUB_OUTPUT

      - name: Trigger Homebrew Tap Update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: dobbo-ca/homebrew-taps
          event-type: update-formula
          client-payload: |
            {
              "formula": "az-go",
              "version": "${{ needs.release.outputs.version }}",
              "darwin_amd64_sha": "${{ steps.checksums.outputs.darwin_amd64 }}",
              "darwin_arm64_sha": "${{ steps.checksums.outputs.darwin_arm64 }}",
              "linux_amd64_sha": "${{ steps.checksums.outputs.linux_amd64 }}",
              "linux_arm64_sha": "${{ steps.checksums.outputs.linux_arm64 }}"
            }
